<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyQuest - تسجيل الدخول</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --blue: #0f3460;
            --pink: #e94560;
            --green: #4ecca3;
            --blue-light: #3da9fc;
        }
        * { box-sizing: border-box; }
        body {
            background: radial-gradient(circle at top, #202852 0%, var(--bg) 48%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .auth-container {
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid var(--blue);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,.4);
        }
        h1 { color: var(--pink); text-align: center; margin-top: 0; font-size: 28px; }
        p.subtitle { text-align: center; color: #a0aec0; margin-bottom: 25px; font-size: 14px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: var(--blue-light); font-weight: bold; }
        .input-group input {
            width: 100%;
            background: var(--bg);
            border: 2px solid var(--blue);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
        }
        .input-group input:focus { outline: none; border-color: var(--green); }
        .btn {
            width: 100%;
            background: var(--pink);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background .2s, transform .2s;
        }
        .btn:hover { background: #ff6b6b; transform: translateY(-2px); }
        .link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--green);
            text-decoration: none;
            font-weight: bold;
        }
        .link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1>PyQuest 🎮</h1>
        <p class="subtitle">سجل دخولك لاستئناف مغامرة البرمجة</p>

        <div class="input-group">
            <label>اسم المستخدم</label>
            <input type="text" id="login-user" placeholder="أدخل اسمك...">
        </div>
        <div class="input-group">
            <label>كلمة المرور</label>
            <input type="password" id="login-pass" placeholder="••••••••">
        </div>

        <button class="btn" onclick="login()">دخول 🚀</button>
        <a href="Cac.html" class="link">ليس لديك حساب؟ إنشاء حساب جديد (Cac.html)</a>
    </div>

    <script>
        // إذا كان المستخدم سجّل الدخول من قبل ولم يضغط «خروج»، ادخله مباشرةً.
        const activeUser = localStorage.getItem('pyquest_active_user');
        if (activeUser) {
            window.location.replace('map.html');
        }

        async function login() {
            const username = document.getElementById('login-user').value.trim();
            const password = document.getElementById('login-pass').value.trim();

            if (!username || !password) {
                alert('الرجاء ملء جميع الحقول!');
                return;
            }

            try {
                const response = await fetch('https://VigitoSon.pythonanywhere.com/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (data.success) {
                    // يظل الحساب معروفًا في الزيارات القادمة حتى يضغط المستخدم «خروج».
                    localStorage.setItem('pyquest_active_user', data.username);
                    window.location.replace('map.html');
                } else {
                    alert(data.message || 'بيانات الدخول غير صحيحة.');
                }
            } catch (error) {
                alert('خطأ في الاتصال بالسيرفر!');
            }
        }
    </script>
</body>
</html>
