<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PyQuest - خريطة المستويات</title><style>:root{--bg:#1a1a2e;--card:#16213e;--blue:#0f3460;--pink:#e94560;--green:#4ecca3}*{box-sizing:border-box}body{background:radial-gradient(circle at top,#202852 0%,var(--bg) 48%);color:#fff;font-family:Segoe UI,Tahoma,sans-serif;margin:0;padding:20px;min-height:100vh;display:flex;justify-content:center}.main-container{max-width:800px;width:100%;text-align:center}header,.progress-container{background:var(--card);padding:25px;border-radius:20px;border:2px solid var(--blue);margin-bottom:25px;position:relative}.logout-btn{position:absolute;top:20px;left:20px;background:var(--pink);color:#fff;border:0;padding:8px 15px;border-radius:8px;cursor:pointer}h1{color:var(--pink)}.subtitle{color:var(--green)}.stage-banner{background:linear-gradient(90deg,var(--pink),#ff6b6b);padding:12px;border-radius:12px;font-weight:bold;margin-bottom:20px}.level-map{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;padding:10px}.level-btn{background:var(--card);padding:25px 15px;border-radius:15px;border:3px solid var(--blue);text-decoration:none;color:#fff;display:flex;flex-direction:column;align-items:center;box-shadow:0 5px 15px #0005}.level-btn:hover{border-color:var(--green);transform:translateY(-3px)}.level-btn.locked{background:#101825;border-color:#212e46;cursor:not-allowed;opacity:.6}.level-btn.locked:hover{transform:none}.lvl-num{font-size:36px;font-weight:bold;color:var(--green)}.lvl-title{font-weight:bold}.lvl-lock{position:absolute;margin-left:180px}.progress-bar{height:12px;background:var(--blue);border-radius:10px;overflow:hidden;margin-top:8px}.progress-fill{height:100%;background:var(--green);transition:width .5s}</style></head><body><div class="main-container"><header><button class="logout-btn" onclick="logout()">خروج</button><h1>رحلة بايثون الممتعة 🐍</h1><p class="subtitle" id="welcome-msg">جاري تحميل بيانات اللاعب...</p></header><div class="stage-banner">⭐ المرحلة الأولى: أساسيات البرمجة</div><div class="level-map"><a href="level1.html" class="level-btn" id="lvl-1"><div class="lvl-num">1</div><div class="lvl-title">الأساسيات (Print)</div></a><a href="level2.html" class="level-btn locked" id="lvl-2"><span class="lvl-lock" id="lock-2">🔒</span><div class="lvl-num">2</div><div class="lvl-title">المتغيرات (Variables)</div></a></div><div class="progress-container"><div id="user-level-status">المستوى الحالي: 0</div><div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div><div id="progress-text">أكمل المستوى الأول لبدء التقدم!</div></div></div><script>
const API='https://VigitoSon.pythonanywhere.com';
window.addEventListener('load',async()=>{const user=localStorage.getItem('pyquest_active_user');if(!user){location.href='index.html';return}document.getElementById('welcome-msg').textContent=`أهلاً بك يا بطل البرمجة ${user} في عالم المغامرات البرمجية!`;try{const response=await fetch(`${API}/get_progress?username=${encodeURIComponent(user)}`);const data=await response.json();if(data.success)updateMapState(Number(data.completed_levels??0));else updateMapState(0)}catch(error){updateMapState(0);document.getElementById('progress-text').textContent='تعذر تحميل التقدم من السيرفر.'}});
function updateMapState(level){const card=document.getElementById('lvl-2'),lock=document.getElementById('lock-2');const fill=document.getElementById('progress-fill'),text=document.getElementById('progress-text'),status=document.getElementById('user-level-status');if(level<1){status.textContent='المستوى الحالي: 0';fill.style.width='0%';text.textContent='أكمل المستوى الأول لفتح المستوى الثاني!';card.classList.add('locked');lock.style.display='block';card.onclick=e=>{e.preventDefault();alert('🔒 يجب عليك إتمام المستوى الأول أولاً.')}}else{status.textContent=`المستوى الحالي: ${level}`;fill.style.width=level>=2?'100%':'50%';text.textContent=level>=2?'أتممت جميع المستويات بنجاح!':'أتممت المستوى الأول! انتقل للمستوى الثاني.';card.classList.remove('locked');lock.style.display='none';card.onclick=null}}
function logout(){localStorage.removeItem('pyquest_active_user');location.href='index.html'}
</script></body></html>
