<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyQuest - إنشاء حساب جديد</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --blue: #0f3460;
            --pink: #e94560;
            --green: #4ecca3;
            --blue-light: #3da9fc;
        }
        * { box-sizing: border-box; }
        body {
            background: radial-gradient(circle at top, #202852 0%, var(--bg) 48%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .auth-container {
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid var(--blue);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,.4);
        }
        h1 { color: var(--green); text-align: center; margin-top: 0; font-size: 28px; }
        p.subtitle { text-align: center; color: #a0aec0; margin-bottom: 25px; font-size: 14px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: var(--blue-light); font-weight: bold; }
        .input-group input {
            width: 100%;
            background: var(--bg);
            border: 2px solid var(--blue);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
        }
        .input-group input:focus { outline: none; border-color: var(--green); }
        .btn {
            width: 100%;
            background: var(--green);
            color: #1a1a2e;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background .2s, transform .2s;
        }
        .btn:hover { background: #3db892; transform: translateY(-2px); }
        .btn:disabled { opacity: 0.65; cursor: wait; transform: none; }
        .link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--blue-light);
            text-decoration: none;
            font-weight: bold;
        }
        .link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1>إنشاء حساب 🛡️</h1>
        <p class="subtitle">انضم لمغامرة PyQuest وابدأ التحدي</p>

        <div class="input-group">
            <label>اختر اسم المستخدم</label>
            <input type="text" id="reg-user" placeholder="ادخل اسمك..." maxlength="30" autocomplete="username">
        </div>
        <div class="input-group">
            <label>كلمة المرور</label>
            <input type="password" id="reg-pass" placeholder="••••••••" autocomplete="new-password">
        </div>

        <button class="btn" id="register-btn" onclick="register()">تسجيل الحساب ✨</button>
        <a href="index.html" class="link">العودة لتسجيل الدخول</a>
    </div>

    <script>
        async function register() {
            const usernameInput = document.getElementById('reg-user');
            const passwordInput = document.getElementById('reg-pass');
            const registerButton = document.getElementById('register-btn');

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username) {
                alert('الرجاء إدخال اسم المستخدم!');
                usernameInput.focus();
                return;
            }

            if (username.length < 3 || username.length > 30) {
                alert('اسم المستخدم يجب أن يكون من 3 إلى 30 حرفاً.');
                usernameInput.focus();
                return;
            }

            // السماح بالعربي والإنجليزي والأرقام والمسافات فقط، مع منع رموز المسارات الخطيرة
            if (/[\\/:*?"<>|\u0000-\u001F]/.test(username)) {
                alert('اسم المستخدم يحتوي على رمز غير مسموح.');
                usernameInput.focus();
                return;
            }

            if (!password) {
                alert('الرجاء إدخال كلمة المرور!');
                passwordInput.focus();
                return;
            }

            registerButton.disabled = true;
            registerButton.textContent = 'جاري إنشاء الحساب...';

            try {
                const response = await fetch('https://VigitoSon.pythonanywhere.com/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    alert('🎉 تم إنشاء الحساب وحفظ ملفك على السيرفر بنجاح!');
                    window.location.href = 'index.html';
                } else {
                    alert(data.message || 'حدث خطأ أثناء إنشاء الحساب.');
                }
            } catch (error) {
                alert('خطأ في الاتصال بالسيرفر!');
            } finally {
                registerButton.disabled = false;
                registerButton.textContent = 'تسجيل الحساب ✨';
            }
        }
    </script>
</body>
</html>
